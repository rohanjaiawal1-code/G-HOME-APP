name: Build Android APK and Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup Java Development Kit
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fetch Flutter Dependencies
        run: flutter pub get

      - name: Build Standalone APK
        run: flutter build apk --release

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v3
        with:
          name: G-HOME-Android-TV-Mobile-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Release EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Fetch Flutter Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v3
        with:
          name: G-HOME-Windows-PC-EXE
          path: build/windows/runner/Release/
